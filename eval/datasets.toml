# Constructed diffs for /results (Phase 6).
#
# Each dataset squashes the `paths` changes of 3-4 consecutive code commits of a public
# repository into one commit on top of `base` (the parent of the first commit), with the
# original commits kept as ground truth. Built by `cleave eval build` (task11).
#
# Checked on 2026-09-27: the check command passes at `base` and at the constructed head
# with the setup below.
#
# The click checks leave out two cases of test_echo_via_pager ("Exception in generator ...",
# ids test5/test6, times each pager). They race the pager process against the generator's
# exception, so they fail when two test runs share the machine, which is what Cleave's
# parallel verification does: with them in, 2 concurrent runs of the same head failed 5
# times out of 6; without them, 21 of 21 concurrent runs passed. click is BSD-3-Clause licensed; Galaxium Travels is IBM's public
# Bob demo application (fork: edish-github/galaxium-travels).

[[datasets]]
name = "click-completions"
repo = "https://github.com/pallets/click"
base = "9982faee85f2715a9cde03639f8c0382561c09ce"
commits = [
  "f14b75063fb36b9208b13a920326926363616b39",  # update dev dependencies
  "a1235aacb1be55dc66ddcfefbf64dec44b6ab54d",  # Fix Zsh completions with colons (#2846)
  "701b313160be12752e49b3f7cea32402c0969a69",  # Fix completions for quoted/escaped parameters in Fish (#3013)
]
paths = ["src", "tests"]
setup = 'uv venv .venv --python 3.11 && uv pip install --python .venv "pytest<8.4"'
check = 'PYTHONPATH=src python -m pytest -q -p no:cacheprovider -k "not (test_echo_via_pager and (test5 or test6))"'
# constructed diff: 19 files, +812 -131; tests: 708 passed at base, 890 at head (12 deselected)

