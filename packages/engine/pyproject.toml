[project]
name = "cleave"
version = "0.1.0"
description = "Split an oversized pull request into a stack of small ones, each proven to pass on its own."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "mcp>=1.12,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.scripts]
cleave = "cleave.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a local clone of the Galaxium fork (set GALAXIUM_REPO)",
  "bob: needs real Bob hook payloads in tests/payloads (open check C1)",
  "runner: Phase 7 (P1) runner specs, run with -m runner",
]
addopts = "-ra"
